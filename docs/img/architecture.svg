  <text class="b" x="56" y="560">rate limits each page</text>
  <rect class="box" x="446" y="60" width="250" height="128" rx="12"/>
  <text class="h" x="466" y="92">Offscreen document</text>
  <text class="m" x="466" y="114">public/pvac-offscreen.html</text>
  <text class="b" x="466" y="138">Chrome only</text>
  <text class="b" x="466" y="157">PVAC WASM in web workers</text>
  <rect class="box" x="446" y="252" width="250" height="128" rx="12"/>
  <text class="h" x="466" y="284">Popup and review windows</text>
  <text class="m" x="466" y="306">index.html</text>
  <text class="b" x="466" y="330">React 18 screens</text>
  <text class="b" x="466" y="349">site reviews by approval id</text>
  <text class="b" x="466" y="368">signs only after a review</text>
  <rect class="box" x="446" y="444" width="250" height="128" rx="12"/>
  <text class="h" x="466" y="476">Background service worker</text>
  <text class="m" x="466" y="498">src/background/</text>
  <text class="b" x="466" y="522">Octra and EVM site handlers</text>
  <text class="b" x="466" y="541">permissions and approvals</text>
  <text class="b" x="466" y="560">tx queue and pending checks</text>
  <rect class="box" x="856" y="252" width="250" height="128" rx="12"/>
  <text class="h" x="876" y="284">0xio Desktop (optional)</text>
  <text class="m" x="876" y="306">ws://127.0.0.1:19345</text>
  <text class="b" x="876" y="330">native PVAC engine</text>
  <text class="b" x="876" y="349">menu bar wallet for sites</text>
  <text class="b" x="876" y="368">paired over 0xio-pair-v1</text>
  <rect class="box" x="856" y="444" width="250" height="128" rx="12"/>
  <text class="h" x="876" y="476">Nodes and services</text>
