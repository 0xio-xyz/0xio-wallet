<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1192 650" width="1192" height="650" role="img" aria-labelledby="t d">
  <title id="t">0xio Wallet extension contexts</title>
  <desc id="d">In the web page, the page provider (window.octra, window.wallet0xio and window.ethereum, used by a dApp or by @0xio/sdk) talks to the content script over a private port. The content script talks to the background service worker with runtime messages. The service worker opens review windows in the popup, which answers with the decision and signed transactions. The popup sends PVAC proof jobs to the offscreen document, or to a paired 0xio Desktop over 0xio-pair-v1. The service worker relays sites that sign on 0xio Desktop (0xio-site-relay-v1). The popup and the service worker both call Octra nodes and 0xio services over JSON-RPC.</desc>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 Z"/></marker>
    <marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="nh" d="M0 0 L10 5 L0 10 Z"/></marker>
    <style>
      .bg { fill: #ffffff; }
      .z { fill: #f3f5f8; }
      .zx { fill: #eef0fd; }
      .box { fill: #ffffff; }
      .zt { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; letter-spacing: 0.2px; }
      .mk { fill: #0000db; }
      .h { font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .b { font: 400 13.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #424a53; }
      .m { font: 400 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0000db; }
      .ea { stroke: #0000db; stroke-width: 1.75; fill: none; }
      .en { stroke: #6e7781; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .ah { fill: #0000db; }
      .nh { fill: #6e7781; }
      .pa { fill: #0000db; }
      .pn { fill: #e6e9ee; }
      .ta { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .tn { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #424a53; }
      .lg { font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .z { fill: #121820; }
        .zx { fill: #141b33; }
        .box { fill: #161b22; }
        .zt { fill: #9198a1; }
        .mk { fill: #5b7cff; }
        .h { fill: #e6edf3; }
        .b { fill: #b7bfc8; }
        .m { fill: #7d97ff; }
        .ea { stroke: #5b7cff; }
        .en { stroke: #8b949e; }
        .ah { fill: #5b7cff; }
        .nh { fill: #8b949e; }
        .pa { fill: #3d5cf0; }
        .pn { fill: #262d36; }
        .tn { fill: #c9d1d9; }
        .lg { fill: #9198a1; }
      }
    </style>
  </defs>
