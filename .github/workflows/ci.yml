name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The lockfile is generated with npm 11; node 22 ships npm 10, which resolves the
      # vite->esbuild tree differently and rejects the lock (EUSAGE "Missing: esbuild@...").
      - name: Pin npm to match the lockfile
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Build (Chrome)
        run: npm run build

      - name: Upload Chrome build artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: dist/
          retention-days: 7

      # Firefox ships a separate target (vite.config.firefox.js -> dist-firefox/); build it too so
      # a Firefox-only break (MV3 differences, non-threaded WASM) is caught, not just Chrome's.
      - name: Build (Firefox)
        run: npm run build:firefox

      - name: Upload Firefox build artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist-firefox
          path: dist-firefox/
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The lockfile is generated with npm 11; node 22 ships npm 10, which resolves the
      # vite->esbuild tree differently and rejects the lock (EUSAGE "Missing: esbuild@...").
      - name: Pin npm to match the lockfile
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
